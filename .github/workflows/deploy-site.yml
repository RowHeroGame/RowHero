# Builds the Astro site and publishes it to GitHub Pages (https://rowhero.uk) on every push to main.
# Pull requests into main get the build only, as a check.
# One-time setup (repo admin): Settings → Pages → Build and deployment → Source: "GitHub Actions";
# Settings → Environments → github-pages → Deployment branches: main; Custom domain: rowhero.uk;
# tick "Enforce HTTPS" once GitHub has issued the certificate.
name: Deploy site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
